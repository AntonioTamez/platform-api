name: CI/CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore PersonsAPI.sln

      - name: Build
        run: dotnet build src/PersonsAPI.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/PersonsAPI.sln --no-build --configuration Release --verbosity normal

  push-image:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read
    env:
      IMAGE_URL: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/personsapi/personsapi:latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_URL }} .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: [push-image]
    permissions:
      contents: read
    env:
      IMAGE_URL: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/personsapi/personsapi:latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy persons-api \
            --image ${{ env.IMAGE_URL }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --quiet

      - name: Print service URL
        run: |
          gcloud run services describe persons-api \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.url)'
